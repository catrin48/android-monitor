<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>館内のご案内 | 山中温泉 花つばき</title>
<style>
:root{
  --washi:#f7f3ec; --washi2:#efe8db; --ink:#2c2620; --ink2:#5a5048;
  --gold:#b08d57; --gold-d:#8c6d3f; --indigo:#36476b; --green:#5a8a6e; --persim:#c08246;
  --line:#e0d6c4; --shadow:0 10px 30px rgba(60,45,25,.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  background:var(--washi); color:var(--ink);
  /* 上詰め。中身が画面より高くても上（見出し）が切れず、下方向にスクロールできる */
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  min-height:100%;
  padding:clamp(16px,3.5vh,40px) clamp(20px,4vw,56px);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden; overflow-y:auto;
}
/* 中身が収まるときだけ、上下の余白を均等にして中央寄せに見せる */
.spacer{flex:1 1 auto; min-height:0;}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(circle at 18% 25%, rgba(176,141,87,.05) 0, transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(54,71,107,.05) 0, transparent 42%);
}
header{text-align:center; position:relative; z-index:1; margin-bottom:clamp(18px,3.5vh,40px);}
header .eyebrow{
  font-size:clamp(.72rem,1.6vw,.9rem); letter-spacing:.42em; color:var(--gold-d);
}
header h1{
  font-size:clamp(1.7rem,4.6vw,3rem); letter-spacing:.14em; color:var(--ink);
  margin:10px 0 6px; font-weight:600;
}
header .line{width:56px;height:1px;background:var(--gold);margin:14px auto 0;}
header p{font-size:clamp(.82rem,1.8vw,1rem); color:var(--ink2); margin-top:12px; letter-spacing:.06em;}

.tiles{
  position:relative; z-index:1;
  display:grid; gap:clamp(16px,2.6vw,30px);
  grid-template-columns:repeat(2,1fr);
  width:100%; max-width:860px;
}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr;}
}
.tile{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; text-decoration:none; color:var(--ink);
  background:#fffdf8; border:1px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow);
  padding:clamp(20px,3.2vw,40px) 20px;
  min-height:clamp(140px,20vh,190px);
  transition:transform .12s ease, box-shadow .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.tile:active{transform:scale(.97); box-shadow:0 6px 18px rgba(60,45,25,.18);}
.tile .ico{font-size:clamp(2.6rem,7vw,3.6rem); line-height:1;}
.tile .ja{font-size:clamp(1.15rem,2.6vw,1.5rem); letter-spacing:.12em; font-weight:600;}
.tile .en{font-size:clamp(.7rem,1.5vw,.82rem); letter-spacing:.22em; color:var(--gold-d);}
.tile.soon{opacity:.5; pointer-events:none;}
.tile.soon .en::after{content:' — 準備中';}

footer{
  position:relative; z-index:1; padding-top:24px;
  font-size:clamp(.68rem,1.4vw,.78rem); color:var(--ink2); letter-spacing:.08em; text-align:center;
}
</style>
</head>
<body>

<div class="spacer"></div>

<header>
  <div class="eyebrow">YAMANAKA ONSEN</div>
  <h1>山中温泉　花つばき</h1>
  <div class="line"></div>
  <p>館内のご案内</p>
</header>

<main class="tiles">
  <a class="tile" href="facility-map/facility-map.html">
    <span class="ico">🗺️</span>
    <span class="ja">館内マップ</span>
    <span class="en">FLOOR MAP</span>
  </a>

  <a class="tile" href="https://bath-board-1az8.onrender.com/allcut" rel="noopener">
    <span class="ico">♨️</span>
    <span class="ja">温泉・サウナの温度</span>
    <span class="en">ONSEN &amp; SAUNA</span>
  </a>

  <a class="tile" href="photo/">
    <span class="ico">📷</span>
    <span class="ja">記念撮影</span>
    <span class="en">PHOTO</span>
  </a>

  <a class="tile soon" href="#" aria-disabled="true">
    <span class="ico">🎲</span>
    <span class="ja">ゲーム</span>
    <span class="en">GAMES</span>
  </a>
</main>

<div class="spacer"></div>

<footer>山中温泉 花つばき　石川県加賀市山中温泉</footer>

<script>
// キオスク: 何も操作が無ければトップ(この画面)に戻す仕込み。
// この index 自体はトップなので、サブページ側で common.js を読み込む想定。
// ここでは二重タップ拡大の抑止のみ。
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
</script>
</body>
</html>
