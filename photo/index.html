<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>記念撮影 | 山中温泉 花つばき</title>
<style>
:root{
  --washi:#f7f3ec; --ink:#2c2620; --ink2:#5a5048;
  --gold:#b08d57; --gold-d:#8c6d3f; --line:#e0d6c4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  background:#14100c; color:#f7f3ec;
  font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  display:flex; flex-direction:column;
}

.stage{
  position:relative; flex:1; min-height:0;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; background:#000;
}
/* 鏡のように左右反転して表示 */
#view{
  width:100%; height:100%; object-fit:cover;
  transform:scaleX(-1);
  background:#000;
}
#shot{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; display:none;
}
#shot.show{display:block;}

.hint{
  position:absolute; left:50%; top:24px; transform:translateX(-50%);
  background:rgba(0,0,0,.42); backdrop-filter:blur(4px);
  padding:10px 22px; border-radius:999px;
  font-size:clamp(.9rem,2vw,1.15rem); letter-spacing:.12em;
}

.count{
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center;
  font-size:26vh; font-weight:700; color:#fff;
  text-shadow:0 6px 40px rgba(0,0,0,.6);
}
.count.show{display:flex;}

.flash{
  position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
}
.flash.fire{animation:flash .5s ease-out;}
@keyframes flash{0%{opacity:.9;}100%{opacity:0;}}

.err{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  max-width:80%; text-align:center; line-height:1.9;
  font-size:clamp(1rem,2.4vw,1.35rem); color:#f2d9c4;
}

.bar{
  display:flex; align-items:center; justify-content:center; gap:clamp(16px,4vw,48px);
  padding:clamp(14px,3vh,26px);
  background:#1b1b1b; border-top:1px solid #333;
}
.btn{
  font-family:inherit; border:none; cursor:pointer;
  color:#f7f3ec; background:transparent;
  font-size:clamp(1rem,2.2vw,1.25rem); letter-spacing:.14em;
  padding:12px 26px; border-radius:12px;
}
.btn.ghost{border:1px solid #4a4640;}
.shutter{
  width:clamp(64px,9vw,84px); height:clamp(64px,9vw,84px);
  border-radius:50%; border:5px solid #f7f3ec; background:var(--gold);
  cursor:pointer; flex:none;
  transition:transform .1s ease;
}
.shutter:active{transform:scale(.92);}
[hidden]{display:none!important;}
</style>
</head>
<body>

<div class="stage">
  <video id="view" playsinline autoplay muted></video>
  <img id="shot" alt="撮影した写真">
  <div class="hint" id="hint">カメラの前に立ってください</div>
  <div class="count" id="count"></div>
  <div class="flash" id="flash"></div>
  <div class="err" id="err" hidden></div>
</div>

<div class="bar" id="bar">
  <button class="btn ghost" id="retake" hidden>とりなおす</button>
  <button class="shutter" id="shutter" aria-label="撮影"></button>
  <button class="btn ghost" id="save" hidden>保存する</button>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const view = document.getElementById('view');
const shot = document.getElementById('shot');
const hint = document.getElementById('hint');
const countEl = document.getElementById('count');
const flash = document.getElementById('flash');
const err = document.getElementById('err');
const shutter = document.getElementById('shutter');
const retake = document.getElementById('retake');
const saveBtn = document.getElementById('save');
const canvas = document.getElementById('canvas');

let stream = null;
let busy = false;

async function startCamera(){
  err.hidden = true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:1920}, height:{ideal:1080} },
      audio:false
    });
    view.srcObject = stream;
    await view.play().catch(()=>{});
    hint.hidden = false;
  }catch(e){
    showError(e);
  }
}

function showError(e){
  hint.hidden = true;
  err.hidden = false;
  const name = (e && e.name) || '';
  if(name === 'NotAllowedError'){
    err.textContent = 'カメラの使用が許可されていません。スタッフにお声がけください。';
  }else if(name === 'NotFoundError' || name === 'OverconstrainedError'){
    err.textContent = 'カメラが見つかりませんでした。';
  }else{
    err.textContent = 'カメラを起動できませんでした。' + (name ? '（' + name + '）' : '');
  }
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function capture(){
  if(busy || !stream) return;
  busy = true;
  hint.hidden = true;

  for(const n of [3,2,1]){
    countEl.textContent = n;
    countEl.classList.add('show');
    await sleep(750);
  }
  countEl.classList.remove('show');

  flash.classList.add('fire');
  setTimeout(()=>flash.classList.remove('fire'), 500);

  const track = stream.getVideoTracks()[0];
  const s = track.getSettings();
  const w = s.width || view.videoWidth || 1280;
  const h = s.height || view.videoHeight || 720;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  // 鏡表示に合わせて左右反転で保存
  ctx.translate(w, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(view, 0, 0, w, h);

  shot.src = canvas.toDataURL('image/jpeg', 0.92);
  shot.classList.add('show');

  shutter.hidden = true;
  retake.hidden = false;
  saveBtn.hidden = false;
  busy = false;
}

function reset(){
  shot.classList.remove('show');
  shot.removeAttribute('src');
  shutter.hidden = false;
  retake.hidden = true;
  saveBtn.hidden = true;
  hint.textContent = 'カメラの前に立ってください';
  hint.hidden = false;
}

function flashHint(msg){
  hint.textContent = msg;
  hint.hidden = false;
}

const nativePhoto =
  (typeof window.KioskPhoto !== 'undefined' && window.KioskPhoto &&
   typeof window.KioskPhoto.savePhoto === 'function') ? window.KioskPhoto : null;

function saveCurrent(){
  const data = shot.getAttribute('src');
  if(!data){ return; }
  saveBtn.disabled = true;

  if(nativePhoto){
    let ok = false;
    try{ ok = nativePhoto.savePhoto(data); }catch(e){ ok = false; }
    flashHint(ok ? '保存しました' : '保存できませんでした');
  }else{
    // キオスク外（通常ブラウザ）ではダウンロードを試す
    try{
      const a = document.createElement('a');
      a.href = data;
      a.download = 'hanatsubaki_' + Date.now() + '.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      flashHint('保存しました');
    }catch(e){
      flashHint('この端末では保存できません');
    }
  }
  setTimeout(()=>{ saveBtn.disabled = false; reset(); }, 1400);
}

shutter.addEventListener('click', capture);
retake.addEventListener('click', reset);
saveBtn.addEventListener('click', saveCurrent);

document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && stream){
    stream.getTracks().forEach(t=>t.stop());
    stream = null;
  }else if(!document.hidden && !stream){
    startCamera();
  }
});

startCamera();
</script>
</body>
</html>
