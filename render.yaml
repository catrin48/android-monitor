services:
  - type: web
    name: android-monitor
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      # HTML は毎回サーバーに確認（キオスクなので更新を即反映したい）
      - path: /*
        name: Cache-Control
        value: "no-cache"
    routes:
      - type: rewrite
        source: /map
        destination: /facility-map/facility-map.html
